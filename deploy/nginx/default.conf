# 静态站 nginx 配置（容器内监听 80，HTTPS 由前置反向代理终结）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 目录补斜杠时用相对跳转，避免跳到容器内部端口（如 http://host:80/works/）
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # sitemap 在 nginx 默认 mime.types 里是 text/xml，必须列出来才会被压缩
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # 带 hash 的构建产物：一年强缓存
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # llms.txt 必须带 charset=utf-8，否则部分爬虫按 Latin-1 读中文会乱码。
    # 注意：default_type 只在扩展名查不到类型时才生效，.txt 已被 mime.types 映射成 text/plain，
    # 所以这里用 types {} 覆盖映射 + charset 显式声明，而不是写 default_type。
    location = /llms.txt {
        include /etc/nginx/snippets/security-headers.conf;
        types { text/plain txt; }
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # HTML 与其余文件：每次协商缓存，发版立即生效
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }
}
