# 安全响应头片段：每个 location 都要 include
# 原因：nginx 的 add_header 不会从 server 层继承到「自己也写了 add_header」的 location，
#      直接写在 server 层的话，/_astro/ 等设置了 Cache-Control 的 location 会悄悄丢掉全部安全头。
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# HSTS 只能在 HTTPS 终结处加（前置反向代理 / CDN），这里是容器内 HTTP，不加。
# CSP 需要按站点实际引用的第三方资源定制，见 security-guard 技能。
